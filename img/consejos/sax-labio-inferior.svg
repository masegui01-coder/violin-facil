<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Figtree, Segoe UI, Roboto, sans-serif">
  <title>El labio de abajo en tres pasos</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2B7A4B"/></marker>
  </defs>
  <rect width="900" height="500" rx="24" fill="#F7F3EE"/>
  <text x="32" y="46" font-size="24" font-weight="800" fill="#141B26">El labio de abajo, paso a paso</text>
  <text x="32" y="72" font-size="15" fill="#5A6678">Vista de perfil y muy ampliada: los dientes en blanco, los labios en rosa, la boca mira a la derecha</text>

  <!-- ============ Paso 1: boca relajada ============ -->
  <g transform="translate(24 96)">
    <rect width="270" height="290" rx="18" fill="#FFFFFF" stroke="#E2D7CB" stroke-width="2"/>
    <circle cx="30" cy="30" r="17" fill="#B4461F"/><text x="30" y="36" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    <text x="56" y="36" font-size="16" font-weight="800" fill="#141B26">Boca relajada</text>
    <!-- encía / mandíbula -->
    <rect x="40" y="62" width="70" height="210" rx="10" fill="#F4E3D3"/>
    <!-- dientes -->
    <path d="M110 70 L140 70 L140 148 C140 156 110 156 110 148 Z" fill="#FFFFFF" stroke="#9AA3B2" stroke-width="2.5"/>
    <path d="M110 254 L140 254 L140 182 C140 174 110 174 110 182 Z" fill="#FFFFFF" stroke="#9AA3B2" stroke-width="2.5"/>
    <!-- labios delante de los dientes -->
    <path d="M140 66 C178 66 196 104 194 140 C193 156 180 162 140 160 Z" fill="#D9827A"/>
    <path d="M140 170 C180 168 194 176 194 196 C196 232 178 262 140 262 Z" fill="#D9827A"/>
  </g>
  <text x="159" y="412" font-size="14" fill="#141B26" text-anchor="middle">Los labios están delante</text>
  <text x="159" y="430" font-size="14" fill="#141B26" text-anchor="middle">de los dientes, sin tensión.</text>

  <!-- flecha entre pasos -->
  <path d="M300 240 L322 240" stroke="#C9A985" stroke-width="4" marker-end="url(#flecha)"/>

  <!-- ============ Paso 2: dobla el labio ============ -->
  <g transform="translate(315 96)">
    <rect width="270" height="290" rx="18" fill="#FFFFFF" stroke="#E2D7CB" stroke-width="2"/>
    <circle cx="30" cy="30" r="17" fill="#B4461F"/><text x="30" y="36" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">2</text>
    <text x="56" y="36" font-size="16" font-weight="800" fill="#141B26">Dobla el labio</text>
    <rect x="40" y="62" width="70" height="210" rx="10" fill="#F4E3D3"/>
    <path d="M110 70 L140 70 L140 148 C140 156 110 156 110 148 Z" fill="#FFFFFF" stroke="#9AA3B2" stroke-width="2.5"/>
    <path d="M140 66 C178 66 196 104 194 140 C193 156 180 162 140 160 Z" fill="#D9827A"/>
    <!-- diente de abajo: la parte tapada en discontinuo -->
    <path d="M110 254 L140 254 L140 196 L110 196 Z" fill="#FFFFFF" stroke="#9AA3B2" stroke-width="2.5"/>
    <!-- labio de abajo enrollado sobre el borde del diente -->
    <path d="M98 192 C98 172 150 164 178 176 C198 186 198 236 178 262 L140 262 L140 204 C128 198 112 198 98 200 Z" fill="#D9827A"/>
    <path d="M110 196 L110 182 C110 174 140 174 140 182 L140 196" fill="none" stroke="#9AA3B2" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- flecha que enrolla -->
    <path d="M214 236 C230 200 214 166 180 156" fill="none" stroke="#2B7A4B" stroke-width="3" marker-end="url(#flecha)"/>
  </g>
  <text x="450" y="412" font-size="14" fill="#141B26" text-anchor="middle">Enrolla el labio de abajo hacia dentro</text>
  <text x="450" y="430" font-size="14" fill="#141B26" text-anchor="middle">hasta tapar el borde de los dientes</text>
  <text x="450" y="448" font-size="14" fill="#141B26" text-anchor="middle">(más o menos la mitad de la parte roja).</text>

  <path d="M591 240 L613 240" stroke="#C9A985" stroke-width="4" marker-end="url(#flecha)"/>

  <!-- ============ Paso 3: apoya la caña ============ -->
  <g transform="translate(606 96)">
    <rect width="270" height="290" rx="18" fill="#FFFFFF" stroke="#E2D7CB" stroke-width="2"/>
    <circle cx="30" cy="30" r="17" fill="#B4461F"/><text x="30" y="36" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    <text x="56" y="36" font-size="16" font-weight="800" fill="#141B26">Apoya la boquilla</text>
    <rect x="40" y="62" width="70" height="210" rx="10" fill="#F4E3D3"/>
    <!-- boquilla con la caña debajo, entrando desde la derecha -->
    <path d="M92 150 L270 136 L270 166 L92 166 Z" fill="#1E2430"/>
    <path d="M92 166 L270 166 L270 173 L96 172 Z" fill="#D9B26A"/>
    <!-- diente de arriba sobre la boquilla, con protector -->
    <rect x="108" y="144" width="34" height="6" rx="2" fill="#B4461F"/>
    <path d="M110 66 L140 66 L140 144 L110 144 Z" fill="#FFFFFF" stroke="#9AA3B2" stroke-width="2.5"/>
    <!-- labio de arriba cerrando sobre la boquilla -->
    <path d="M140 62 C178 62 196 100 194 126 C193 138 182 144 140 146 Z" fill="#D9827A"/>
    <!-- labio de abajo: cojín entre el diente y la caña -->
    <path d="M110 256 L140 256 L140 200 L110 200 Z" fill="#FFFFFF" stroke="#9AA3B2" stroke-width="2.5"/>
    <path d="M98 180 C100 174 150 172 178 178 C198 188 198 236 178 262 L140 262 L140 206 C128 200 112 200 98 202 Z" fill="#D9827A"/>
    <!-- marca del cojín -->
    <path d="M232 186 L190 180" stroke="#2B7A4B" stroke-width="2.5" marker-end="url(#flecha)"/>
    <text x="236" y="190" font-size="12" font-weight="800" fill="#2B7A4B">cojín</text>
  </g>
  <text x="741" y="412" font-size="14" fill="#141B26" text-anchor="middle">La caña descansa sobre el labio,</text>
  <text x="741" y="430" font-size="14" fill="#141B26" text-anchor="middle">como sobre un cojín. El diente</text>
  <text x="741" y="448" font-size="14" fill="#141B26" text-anchor="middle">de abajo nunca la toca.</text>

  <!-- Comprobación -->
  <rect x="24" y="460" width="852" height="30" rx="10" fill="#DBF1E5"/>
  <text x="450" y="481" font-size="14" fill="#16804F" text-anchor="middle"><tspan font-weight="800">Comprueba:</tspan> si notas el diente apretando la caña, dobla un poco más el labio; si el sonido se ahoga, estás mordiendo.</text>
</svg>
