<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Figtree, Segoe UI, Roboto, sans-serif">
  <title>Ejercicio con tudel y boquilla</title>
  <rect width="720" height="440" rx="24" fill="#F7F3EE"/>
  <text x="32" y="46" font-size="24" font-weight="800" fill="#141B26">Consejo para empezar · tudel y boquilla</text>
  <text x="32" y="72" font-size="15" fill="#5A6678">Sopla con presión constante y escucha qué nota sale</text>

  <!-- Tudel + boquilla -->
  <g transform="translate(60 120)">
    <path d="M0 40 L150 30 L150 62 L0 52 Z" fill="#1E2430"/>
    <path d="M0 52 L150 62 L150 66 L4 56 Z" fill="#D9B26A"/>
    <rect x="96" y="24" width="26" height="46" rx="5" fill="none" stroke="#8A93A3" stroke-width="4"/>
    <path d="M150 34 C220 34 270 46 300 80 L300 98 C268 66 220 62 150 60 Z" fill="#D7A63A"/>
    <!-- aire -->
    <path d="M-40 46 L-8 46" stroke="#17798A" stroke-width="4"/>
    <path d="M-14 38 L-4 46 L-14 54" fill="none" stroke="#17798A" stroke-width="4"/>
    <text x="-44" y="30" font-size="13" font-weight="700" fill="#17798A">aire constante</text>
  </g>

  <!-- Indicador -->
  <g transform="translate(430 120)">
    <path d="M0 120 A120 120 0 0 1 240 120" fill="none" stroke="#E2D7CB" stroke-width="22" stroke-linecap="round"/>
    <path d="M0 120 A120 120 0 0 1 70 22" fill="none" stroke="#C2372F" stroke-width="22" stroke-linecap="round" opacity=".55"/>
    <path d="M170 22 A120 120 0 0 1 240 120" fill="none" stroke="#C2372F" stroke-width="22" stroke-linecap="round" opacity=".55"/>
    <path d="M90 6 A120 120 0 0 1 150 6" fill="none" stroke="#2B7A4B" stroke-width="22"/>
    <line x1="120" y1="120" x2="120" y2="20" stroke="#141B26" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="10" fill="#141B26"/>
    <text x="-6" y="156" font-size="13" font-weight="700" fill="#C2372F">muy grave</text>
    <text x="-6" y="172" font-size="12" fill="#141B26">embocadura floja</text>
    <text x="246" y="156" font-size="13" font-weight="700" fill="#C2372F" text-anchor="end">muy agudo</text>
    <text x="246" y="172" font-size="12" fill="#141B26" text-anchor="end">estás mordiendo</text>
    <text x="120" y="-24" font-size="14" font-weight="800" fill="#2B7A4B" text-anchor="middle">nota de referencia</text>
  </g>

  <!-- Tabla de referencia -->
  <g font-size="14" fill="#141B26">
    <rect x="32" y="314" width="656" height="104" rx="14" fill="#FFFFFF" stroke="#E2D7CB" stroke-width="2"/>
    <text x="52" y="342" font-weight="800">Notas de referencia (sonido real, aproximado)</text>
    <text x="52" y="366">Saxo alto · solo boquilla: La (880 Hz) · tudel + boquilla: La♭ / Sol♯</text>
    <text x="52" y="388">Saxo tenor · solo boquilla: Sol</text>
    <text x="52" y="408" font-size="12" fill="#5A6678">El afinador de Band Flow te dice la nota mientras soplas.</text>
  </g>
</svg>
